<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sphere position="1 2 0" rotation="90 0 0" color="yellow" side="double" radius="1" phi-start="0" phi-length="330"></a-sphere>
      <a-sphere color="black" radius="0.2" position="1 2 1"></a-sphere>
      <a-sphere color="white" radius="0.3" position="1 2 0.8"></a-sphere>
      <a-sphere color="black" radius="0.2" position="1 2 -1"></a-sphere>
      <a-sphere color="white" radius="0.3" position="1 2 -0.8"></a-sphere>
      <a-sky color="black"></a-sky>
    </a-scene>
  </body>
</html>
